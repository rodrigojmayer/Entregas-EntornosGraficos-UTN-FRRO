<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <title>Practica 3 Ejercicio 5</title>
    </head>
    <body>
        <div class="container  my-5 ">
            <div class="row justify-content-center">
                <div class="col-4 bg-secondary text-white p-4 rounded shadow">
                    <form>
                        <div class="row">
                            <div class="col-12">                 
                                <div class="mb-3">
                                    <label for="inputNombre" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="inputNombre">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-12">          
                                <div class="mb-3">
                                    <label for="inputEmail" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="inputEmail" placeholder="nombre@gmail.com">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-12">
                                <div class="mb-3">
                                <label for="inputTelefono" class="form-label">Telefono</label>
                                <input type="phone" class="form-control" id="inputTelefono">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <div class="mb-3">
                                <label for="inputAsunto" class="form-label">Asunto</label>
                                <input type="text" class="form-control" id="inputAsunto">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <div class="mb-3">
                                <label class="form-label" for="textAreaMensaje">Mensaje</label>
                                <textarea class="form-control" id="textAreaMensaje"></textarea>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
